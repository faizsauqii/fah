# Untuk Anggota N: menjalankan core-service sendirian di laptop.
#   docker compose -f docker-compose.dev.yml up --build
#   curl http://localhost:3000/healthz
services:
  core-service:
    build: .
    env_file: .env
    environment:
      CORE_DB_PATH: /data/core.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - core-data-dev:/data
    mem_limit: 256m
    cpus: 0.5

volumes:
  core-data-dev:
