# Gateway JamHijau (Anggota S). Sesuai KESEPAKATAN-TEKNIS.md (disimpan di luar repo) bagian 2, 4, 5.
worker_processes 1;
events { worker_connections 512; }

http {
  default_type application/json;
  charset utf-8;
  sendfile on;
  keepalive_timeout 30s;
  server_tokens off;

  # DNS internal Docker. Nama service di-resolve ulang tiap 10 detik, jadi
  # gateway tetap jalan walau core-service/auth-service dibuat ulang (IP berubah).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Di balik Cloudflare Tunnel semua request datang dari kontainer cloudflared.
  # IP asli pengguna diambil dari CF-Connecting-IP, hanya jika datang dari jaringan Docker.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  # Anonim dibatasi per IP, pembawa X-API-Key dibatasi per nilai key.
  # Key kosong = "" artinya zona itu tidak berlaku untuk request tersebut.
  map $http_x_api_key $limit_anon { "" $binary_remote_addr; default ""; }
  map $http_x_api_key $limit_key  { "" "";                   default $http_x_api_key; }

  limit_req_zone $limit_anon         zone=anon:10m    rate=30r/m;
  limit_req_zone $limit_key          zone=apikey:10m  rate=120r/m;
  limit_req_zone $binary_remote_addr zone=authlim:10m rate=10r/m;
  limit_req_status 429;

  log_format main '$remote_addr "$request" $status ${request_time}s up=$upstream_status';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server {
    listen 80;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;

    # Error buatan Nginx diganti JSON format kontrak. Error JSON dari service
    # (mis. 503 AUTH_UNAVAILABLE dari core) tetap diteruskan apa adanya.
    error_page 429 = @rate_limited;
    error_page 502 503 = @bad_gateway;
    error_page 504 = @gateway_timeout;
    error_page 413 = @too_large;

    set $core http://core-service:3000;
    set $auth http://auth-service:3001;

    # Health gateway sendiri (tidak menyentuh service lain).
    location = /api/health {
      return 200 '{"status":"ok","service":"gateway"}';
    }

    # Endpoint internal tidak boleh terjangkau dari internet.
    location /internal/ {
      return 404 '{"error":{"code":"NOT_FOUND","message":"Endpoint tidak ditemukan."}}';
    }

    # Login dan register: 10/menit per IP untuk menahan tebak password.
    location ~ ^/api/auth/(login|register)$ {
      limit_req zone=authlim burst=5 nodelay;
      proxy_pass $auth;
    }

    location /api/auth/ {
      limit_req zone=anon burst=10 nodelay;
      limit_req zone=apikey burst=30 nodelay;
      proxy_pass $auth;
    }

    location /api/ {
      limit_req zone=anon burst=10 nodelay;
      limit_req zone=apikey burst=30 nodelay;
      proxy_pass $core;
    }

    location = /api {
      return 404 '{"error":{"code":"NOT_FOUND","message":"Gunakan endpoint di bawah /api/, misalnya /api/risk."}}';
    }

    location / {
      return 404 '{"error":{"code":"NOT_FOUND","message":"Endpoint tidak ditemukan. API JamHijau ada di /api/."}}';
    }

    location @rate_limited {
      add_header Retry-After 60 always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Terlalu banyak permintaan, coba lagi sebentar lagi."}}';
    }
    location @bad_gateway {
      return 502 '{"error":{"code":"BAD_GATEWAY","message":"Layanan di belakang gateway sedang tidak tersedia."}}';
    }
    location @gateway_timeout {
      return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"Layanan terlalu lama merespons."}}';
    }
    location @too_large {
      return 413 '{"error":{"code":"VALIDATION_ERROR","message":"Body permintaan terlalu besar."}}';
    }
  }
}
